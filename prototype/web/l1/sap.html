<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>SAP Easy Access</title>
</head>
<body>
  <div class="sapwin">
    <div class="titlebar"><span class="logo">SAP</span><span id="wintitle">SAP Easy Access</span><span class="winbtns">_ □ ×</span></div>
    <div class="menubar"><span>メニュー(<u>M</u>)</span><span>編集(<u>E</u>)</span><span>ジャンプ(<u>G</u>)</span><span>環境(<u>N</u>)</span><span>システム(<u>Y</u>)</span><span>ヘルプ(<u>H</u>)</span></div>
    <div class="systoolbar">
      <span class="okbtn" title="Enter">✔</span>
      <input id="okcode" class="okcode" placeholder="" autocomplete="off" spellcheck="false">
      <span class="tb" title="保存">💾</span><span class="tb" id="back" title="戻る (F3)">◀</span><span class="tb" title="終了">⏏</span><span class="tb" title="中止">✖</span>
      <span class="sep"></span><span class="tb" title="印刷">🖶</span><span class="tb" title="検索">🔍</span>
      <span class="sep"></span><span class="tb" title="ヘルプ">?</span>
    </div>
    <div class="screentitle" id="screentitle">SAP Easy Access</div>
    <div class="apptoolbar" id="apptoolbar"></div>
    <div class="body" id="body"></div>
    <div class="statusbar"><span id="status" class="msg"></span><span class="sysinfo">S4P (1) 100 ▾ │ sapprd01 │ INS</span></div>
  </div>
  <a class="back-to-hub" href="/">司令塔へ</a>
  <script type="module" src="/src/l1/sap.ts"></script>
</body>
</html>
